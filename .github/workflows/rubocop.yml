name: RuboCop

on: [push, pull_request]

permissions:
  contents: read

jobs:
  rubocop:
    # RuboCop is pinned to < 0.49 (see Gemfile), which needs Ruby 2.7.
    # Ruby 2.7 is not built for newer runner images, so pin the runner.
    runs-on: ubuntu-24.04
    env:
      # Install only the rubocop Gemfile group
      BUNDLE_WITHOUT: 'default:test'

    steps:
    - uses: actions/checkout@v7
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '2.7'
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: Run RuboCop
      run: bundle exec rubocop
